<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 300" width="490" height="300">
<style>
    .text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 14px;
        fill: #c9d1d9;
    }
    .key {
        fill: #58a6ff;
        font-weight: bold;
    }
    .title {
        fill: #58a6ff;
        font-weight: bold;
    }
    .bg {
        fill: #0d1117;
        rx: 10px;
    }
    .animated-row {
        opacity: 0;
        animation: fadeIn 0.5s forwards;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateX(-10px); }
        to { opacity: 1; transform: translateX(0); }
    }
</style>
<rect width="100%" height="100%" class="bg" />
<text x="20" y="30" class="text title animated-row" style="animation-delay: 0.1s">diego@github</text>
<text x="20" y="54" class="text animated-row" style="animation-delay: 0.2s">------------</text>

<g class="animated-row" style="animation-delay: 0.3s">
    <text x="20" y="78" class="text key">Role</text>
    <text x="120" y="78" class="text">:</text>
    <text x="140" y="78" class="text">Full Stack Developer</text>
</g>

<g class="animated-row" style="animation-delay: 0.4s">
