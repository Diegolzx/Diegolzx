<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 200" width="540" height="200">
<style>
    .bg { fill: #0d1117; rx: 10px; }
    .text { fill: #c9d1d9; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; }
    .title { fill: #58a6ff; font-weight: bold; font-size: 14px; }
    .repo { fill: #3fb950; font-weight: bold; }
    .desc { fill: #8b949e; font-size: 11px; }
    .item { opacity: 0; animation: fadeUp 0.5s forwards; }
    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
<rect width="100%" height="100%" class="bg" />
<text x="20" y="30" class="text title">Latest Projects</text>
<text x="20" y="45" class="text">----------------------------------------</text>
<g class="item" style="animation-delay: 0.0s;">
    <text x="20" y="70" class="text repo">📁 Diegolzx</text>
    <text x="40" y="88" class="desc">No description provided.</text>
</g>
<g class="item" style="animation-delay: 0.15s;">
    <text x="20" y="115" class="text repo">📁 valle-mezquital-system</text>
    <text x="40" y="133" class="desc">No description provided.</text>
</g>
<g class="item" style="animation-delay: 0.3s;">
    <text x="20" y="160" class="text repo">📁 Air-Watch</text>
    <text x="40" y="178" class="desc">No description provided.</text>
</g>
</svg>