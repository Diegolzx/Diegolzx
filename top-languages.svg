<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
<style>
    .bg { fill: #0d1117; rx: 10px; }
    .text { fill: #c9d1d9; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; }
    .title { fill: #58a6ff; font-weight: bold; font-size: 14px; }
    .bar { animation: slideRight 1s forwards; }
    @keyframes slideRight {
        from { transform: scaleX(0); }
        to { transform: scaleX(1); }
    }
</style>
<rect width="100%" height="100%" class="bg" />
<text x="15" y="30" class="text title">Top Languages</text>
<text x="15" y="45" class="text">----------------------</text>
<g style="animation-delay: 0.0s; opacity: 0; animation: fadeIn 0.5s forwards;">
    <text x="15" y="80" class="text">HTML</text>
    <rect x="90" y="70" width="150" height="12" fill="#e34c26" rx="3" class="bar" style="transform-origin: left;" />
</g>
<g style="animation-delay: 0.1s; opacity: 0; animation: fadeIn 0.5s forwards;">
    <text x="15" y="105" class="text">Jupyter No</text>
    <rect x="90" y="95" width="40" height="12" fill="#8b949e" rx="3" class="bar" style="transform-origin: left;" />
</g>
<g style="animation-delay: 0.2s; opacity: 0; animation: fadeIn 0.5s forwards;">
    <text x="15" y="130" class="text">JavaScript</text>
    <rect x="90" y="120" width="27" height="12" fill="#f1e05a" rx="3" class="bar" style="transform-origin: left;" />
</g>
<g style="animation-delay: 0.30000000000000004s; opacity: 0; animation: fadeIn 0.5s forwards;">
    <text x="15" y="155" class="text">Python</text>
    <rect x="90" y="145" width="13" height="12" fill="#3572A5" rx="3" class="bar" style="transform-origin: left;" />
</g>
<g style="animation-delay: 0.4s; opacity: 0; animation: fadeIn 0.5s forwards;">
    <text x="15" y="180" class="text">C#</text>
    <rect x="90" y="170" width="13" height="12" fill="#178600" rx="3" class="bar" style="transform-origin: left;" />
</g>
<style>
    @keyframes fadeIn {
        to { opacity: 1; }
    }
</style>
</svg>